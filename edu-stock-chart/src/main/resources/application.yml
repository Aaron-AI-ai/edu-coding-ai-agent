spring:
  application:
    name: edu-stock-chart

  datasource:
    url: jdbc:h2:mem:stockchart;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always          # schema.sql → data.sql → data-detail.sql 순서로 실행
      data-locations: classpath:data.sql, classpath:data-detail.sql   # data-detail.sql: 종목 상세 시드 (SOXL 외 16종목)

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: kr.co.koscom.edu.stockchart.domain
  configuration:
    map-underscore-to-camel-case: true   # trade_date → tradeDate

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    kr.co.koscom.edu: DEBUG
