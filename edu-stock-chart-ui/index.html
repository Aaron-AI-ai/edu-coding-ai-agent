<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코스콤증권</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="logo" href="#"><span class="logo-mark"></span>코스콤증권</a>
      <nav class="menu" data-group>
        <button class="active">홈</button>
        <button>피드</button>
        <button>주식 골라보기</button>
        <button>내 계좌</button>
      </nav>
      <div class="search-box">
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4-4" /></svg>
          <kbd>/</kbd><input id="search-input" placeholder="를 눌러 검색하세요" autocomplete="off" />
        </label>
        <ul id="search-results" class="search-results" hidden></ul>
      </div>
      <button class="btn-login">로그인</button>
    </header>

    <aside class="rail">
      <button class="rail-fold">«</button>
      <button><svg viewBox="0 0 24 24"><path d="M4 20V10l5 3 5-7 6 4v10z" /></svg>내 투자</button>
      <button><svg viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z" /></svg>관심</button>
      <button><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 7v5l3 2" class="cut" /></svg>최근 본</button>
      <hr />
      <button><svg viewBox="0 0 24 24"><path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 1-6 1-9z" /></svg>실시간</button>
    </aside>

    <main id="dashboard" class="panel">
      <div class="market-status">
        <span class="dot closed"></span>국내 장 닫힘
        <span class="dot open"></span>해외 정규장 <span class="dim">22:30 ~ 05:00</span>
        <button class="btn-ai">✦ 코스콤증권 AI 소개</button>
      </div>

      <section class="board">
        <div id="main-index" class="main-index"></div>
        <div id="index-grid" class="index-grid"></div>
        <div class="schedule">
          <h3>주요 일정 <span class="chev">›</span></h3>
          <p class="summary">경제성장률 발표 등 중요 경제지표와 함께, 마이크로소프트·아마존 등 빅테크 실적발표가 이어집니다.</p>
          <ul id="schedule-list"></ul>
        </div>
      </section>

      <div class="tabs">
        <nav data-group>
          <button class="active">실시간 차트</button>
          <button>지금 뜨는 산업</button>
          <button>외국인·기관 매매 동향</button>
        </nav>
        <button class="toggle-summary"><span class="toggle-icon"></span>요약 펼치기</button>
      </div>

      <div class="filters">
        <div class="seg" data-group>
          <button class="active" data-market="ALL">전체</button><button data-market="DOMESTIC">국내</button><button data-market="OVERSEAS">해외</button>
        </div>
        <div class="seg" data-group>
          <button class="active" data-sort="TRADE_AMOUNT">코스콤증권 거래대금</button><button>코스콤증권 거래량</button><button>거래대금</button><button>거래량</button><button data-sort="RISE">급상승</button><button data-sort="FALL">급하락</button>
        </div>
        <button class="seg select">실시간 <span class="caret">⌄</span></button>
        <button class="seg check on" data-toggle><span class="checkmark">✓</span>투자위험 주식 숨기기</button>
      </div>

      <table class="ranking">
        <thead>
          <tr>
            <th colspan="3">순위·오늘 <span id="asof"></span> 기준</th>
            <th class="num">현재가</th>
            <th class="num">등락률</th>
            <th class="num">거래대금 순</th>
            <th class="num">시가총액</th>
            <th>코스콤증권 거래 비율 <i class="help">?</i></th>
            <th>산업</th>
            <th>코스콤증권 AI 요약 <i class="help">?</i></th>
          </tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>
    </main>

    <!-- 종목 상세 · #/stocks/{symbol} 일 때 dashboard 대신 보인다 (GET /api/stocks/{symbol}/detail) -->
    <main id="detail" class="detail" hidden></main>

    <!-- 상세 API 가 없거나 실패하면 띄우는 안내 -->
    <dialog id="notice" class="notice-dialog">
      <p id="notice-msg"></p>
      <form method="dialog"><button>확인</button></form>
    </dialog>

    <footer class="ticker">
      <button class="notice">투자 유의사항</button>
      <div id="ticker-items" class="ticker-items"></div>
      <button class="btn-dark">다크모드</button>
      <button class="btn-moon">☾</button>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
